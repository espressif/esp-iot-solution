version: "1.1.0"
targets:
  - esp32
  - esp32s3
  - esp32c2
  - esp32c3
  - esp32c5
  - esp32c6
  - esp32c61
  - esp32h2
  - esp32p4
description: Controller-side client for IDF esp_local_ctrl (HTTP, BLE, Console; Sec0/1/2)
url: https://github.com/espressif/esp-iot-solution/tree/master/components/esp_local_controller
repository: https://github.com/espressif/esp-iot-solution.git
issues: https://github.com/espressif/esp-iot-solution/issues
examples:
  - path: ../../examples/esp_local_controller
dependencies:
  idf:
    version: ">=5.3"
  cmake_utilities: "0.*"
  # override_path wins for in-tree builds. ^1.1.0 is the registry floor:
  # 1.0.x shares one Sec0 sentinel and does not keep a per-peer HTTP connection.
  protocomm_ext:
    version: "^1.1.0"
    override_path: "../protocomm_ext"
sbom:
  supplier: 'Organization: Espressif Systems (Shanghai) CO LTD'
  originator: 'Organization: Espressif Systems (Shanghai) CO LTD'
