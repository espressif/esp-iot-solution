version: "1.0.0"

dependencies:
  idf:
    version: ">=5.5.5"

  espressif/esp_lcd_touch:
    version: "^1"
    public: true

  espressif/button:
    version: "^4"
    public: true

  espressif/knob:
    version: "^1"
    public: true

  espressif/esp_lcd_ek79007:
    version: "*"
    override_path: "../../../../../components/display/lcd/esp_lcd_ek79007"
    rules:
      - if: "target == esp32p4"

  espressif/esp_lcd_st77916:
    version: "*"
    override_path: "../../../../../components/display/lcd/esp_lcd_st77916"

  espressif/esp_lcd_ili9341:
    version: "^2"

  espressif/esp_lcd_gc9a01:
    version: "^2"

  espressif/esp_lcd_touch_gt911:
    version: "^1"

  espressif/esp_lcd_touch_gt1151:
    version: "^1"

  espressif/esp_lcd_touch_cst816s:
    version: "^1"

  espressif/esp_lcd_gc9503:
    version: "3.0.1"
    rules:
      - if: "target == esp32s3"

  espressif/esp_lcd_panel_io_additions:
    version: "1.0.1~1"
    rules:
      - if: "target == esp32s3"

  espressif/esp_io_expander:
    version: "1.2.1"
    rules:
      - if: "target == esp32s3"

  espressif/esp_io_expander_tca9554:
    version: "2.0.3"
    rules:
      - if: "target == esp32s3"
