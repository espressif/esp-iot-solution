version: 0.3.0
targets:
  - esp32p4
  - esp32s3
  - esp32s31
dependencies:
  idf: ">=5.4.4,!=5.5.0,!=5.5.1,!=5.5.2"
  espressif/esp_board_manager:
    version: "^0.7.1"
    require: public
  espressif/tinyusb: "*"
  espressif/esp_new_jpeg:
    version: "^1.0.1"
    rules:
      - if: "target in [esp32s3]"
  espressif/usb_device_uac:
    version: "*"
    override_path: "../../../../../components/usb/usb_device_uac"
